<h1>简介</h1>

<p><b>即便是大霸星祭</b>，<b>暗部的委托也照样无休</b>！<b>无精打采的少女泷壶竟干劲满满</b>？！</p>
<br/>
<p>大霸星祭，是由学园都市所有学校联合举办的超大规模体育祭。这既是学园都市为数不多对外开放的机会，也是人潮涌动、热闹非凡的一大盛事。</p>
<p>然而，对天杀的「暗部」而言，管他什么庆典活动，工作照样找上门来。这次的任务，是调查一桩不自然的自杀案——死者是负责大霸星祭参赛选手兴奋剂检测的相关负责人。</p>
<p>一心想看遍妹妹芙蕾梅亚高光时刻的芙兰达自不必说，在「明面」世界明朗欢快的庆典氛围里，「ITEM」众人都对工作提不起兴致。唯有向来无精打采的运动服少女——泷壶理后，却不知为何干劲十足……？！</p>
