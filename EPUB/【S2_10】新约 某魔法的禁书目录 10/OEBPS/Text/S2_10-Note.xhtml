<h1>译注</h1>
<ul>
<li epub:type="footnote" id="note1">「小欧提」（オティちゃん）与「老爷爷」（おじちゃん）的日语发音相似。</li>
<li epub:type="footnote" id="note2">「欧提努」（オティヌ）与指代男性隐私部位的日语俗称（原文末作「おちん……」）发音相似。</li>
<li epub:type="footnote" id="note3">原文为Salvere000，作者误记，应为Salvare000。详见旧约4的译注。</li>
<li epub:type="footnote" id="note4">赤穗浪士（赤穂浪士），指日本江户时代中期元禄年间，为了帮主君报仇而忍辱负重多年的47名赤穗藩家臣。他们表现出的忠诚、执着和忍耐力至今为日本人所称道。</li>
</ul>
