<h1 class="color1">简介</h1>

<p><b>对</b>「<b>ITEM</b>」<b>下达的新命令</b>，<b>下一个目标是芙兰达</b>？！</p>
<br/>
<p>从秋天开始的新学期，芙兰达·塞维伦一觉醒来，却发现自己身处新宿站的月台。作为武器的自制炸弹被夺走，明显是出了某种大事件，然而芙兰达本人却完全不知道发生了什么。</p>
<p>但是，学园都市有着不得擅自跨越「墙壁」的铁律。作为知晓学园都市真面目的「暗部」之人更是如此。打破规则之人必将受到惩罚。然而担起此任的却是麦野她们的「ITEM」……</p>
<p>拥有学园都市第四位的超能力者的「ITEM」，其可怕的威力转向了芙兰达自己？！</p>
