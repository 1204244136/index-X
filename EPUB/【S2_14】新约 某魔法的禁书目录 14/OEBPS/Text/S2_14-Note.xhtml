<h1>译注</h1>
<ul>
<li epub:type="footnote" id="note1">京都腔（京都弁），指京都一带的方言腔调。中文不逐句复现方言腔调，一律按普通口语译出。</li>
<li epub:type="footnote" id="note2">指日本平安时代开始着用的女性礼服。</li>
<li epub:type="footnote" id="note3">修格斯（Shoggoth），克苏鲁神话中的漆黑黏液状生物，能够自由自在地改变形体与生成器官。</li>
<li epub:type="footnote" id="note4">酷日本即Cool Japan，为日本政府对外进行文化宣传、出口的用语，但一般提及时往往带有嘲讽意味。</li>
<li epub:type="footnote" id="note5">指Cinderella与Shirley Temple两种无酒精鸡尾酒的名称，中文分别译作灰姑娘和邓波儿。</li>
<li epub:type="footnote" id="note6">「炭」是日文「たん」的音译，「たん」为「ちゃん」的戏谑变体，多用于调侃或卖萌的称呼。</li>
</ul>
