<h1 class="center">译注</h1>
<ul>
<li epub:type="footnote" id="note1">精神感应（テレパス），超电磁炮动画里注音为テレパシー。</li>
<li epub:type="footnote" id="note2">「发麻」在日语里还指「陶醉」。</li>
<li epub:type="footnote" id="note3">「制服？」的问号，是原文就有的。</li>
<li epub:type="footnote" id="note4">鬼子母神，原指婆罗门教中的恶神，护法二十诸天之一，专吃人间小孩，称之为「母夜叉」。被佛法教化后，成为专司护持儿童的护法神。</li>
<li epub:type="footnote" id="note5">「大胃妖怪」（妖怪くっちゃ寝）是非常可爱又有很强的实力，一般是指平时却过着吃完就睡、自甘堕落的生活，还特别难养活的那类角色。</li>
</ul>
