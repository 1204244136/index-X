<h1>行间　四</h1>

<p>少女曾以为，只要成为特殊的存在，自己就会获得幸福。</p>
<p>少女曾认为，自己得不到幸福，是因为还没有做出足够多的突破。</p>
<p>又或者像灰姑娘那样。又或者像白雪公主那样。</p>
<p>就这样。</p>
<p>磨尖，磨尖，磨尖磨尖磨尖，干脆磨尖到危险的地步。</p>
<p>天真地提升着自己。</p>
<p>成为谁也无法企及的某个人。</p>
<p>那么，接下来差不多该对一下答案了。</p>
<p>下结论吧。</p>
<br/>
<p>实际上，少女最后怎么样了呢？</p>
