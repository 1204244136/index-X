<h1>单车特技全集，其四</h1>

<p>「拥抱」</p>
<p>难度二。</p>
<p>这是表演者不坐车座、从旁抓住车身的单车特技。光是这样倒很简单，不过这项技巧只要抓着车子就算数，连在车把上倒立也不例外。因此，难度设定得高了一级。</p>
<p>「爬楼梯」</p>
<p>难度一。</p>
<p>利用巅峰单车平顺地登上阶梯的技巧。乍看之下只要交给悬吊系统，自己骑车往上冲就好，实际上这么做会导致爆胎。表演者必须略微上下调整重心，配合时机协助吸收冲击才行。</p>
