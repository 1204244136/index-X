<h1 class="center">译注</h1>
<ul>
<li epub:type="footnote" id="note1">毕达哥拉斯（希腊语：Πυθαγόρας），希腊哲学家和数学家。曾到意大利南部传授数学及宣传他的哲学思想，和信徒们组成了一个名为「毕达哥拉斯学派」的政治和宗教团体。</li>
<li epub:type="footnote" id="note2">意为冒犯、亵渎。</li>
<li epub:type="footnote" id="note3">日本宣示的非核三原则，即为不持有、不制造、不引进核武器。</li>
<li epub:type="footnote" id="note4">大淫妇，是《启示录》中提到的寓言式邪恶人物，又译为「巴比伦大妓女」。有人认为她指一个强大的宗教帝国，但本文中所指的是世上所有错误的宗教——它们有许多共通的教义与习俗，都源于巴比伦神秘难懂的主张。</li>
</ul>
