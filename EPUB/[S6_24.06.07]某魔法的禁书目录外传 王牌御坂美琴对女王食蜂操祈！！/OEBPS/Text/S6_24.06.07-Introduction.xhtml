<h1 class="color1">简介</h1>

<p>理所当然的那场灾难终于爆发了。</p>
<p>学园都市第三位『超电磁炮』御坂美琴。</p>
<p>学园都市第五位『心理掌握』食蜂操祈。</p>
<p>她们是特别的少女，同为名门常盘台中学的大小姐们中的两大顶点。</p>
<p>也许某种意义上这场冲突根本就是必然会发生的。这已经演变成Level 5与Level 5之间毫无规则毫无礼仪毫无道德毫无禁忌，真真正正的正面冲突了。就算摧毁整个世界也要分个高下。</p>
<p>完全不顾旁人如何，发挥出超能力者的全部实力。</p>
<p>如果第三位和第五位在这学园都市里毫无顾虑毫不留情拼尽全力，究竟哪边更强呢！</p>
