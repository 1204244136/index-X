name: Build EPUB Release

on:
  schedule:
    - cron: '0 15 * * *' # UTC 15:00 = 北京时间 23:00
  workflow_dispatch:
    inputs:
      release_date:
        description: '发布日期（北京时间，YYYY.MM.DD）；留空按最近一次计划发布日推算'
        required: false
        default: ''
      force_release:
        description: '当前提交已有日期标签时仍强制重新发布'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: epub-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-epubs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Prepare release metadata
        env:
          RELEASE_DATE_INPUT: ${{ inputs.release_date }}
        run: |
          set -euo pipefail
          # 标签取「计划发布日」而非作业启动时刻：cron 15:00Z 与北京时间 23:00 同为一天，
          # 而 GitHub 计划任务常延迟数小时，按启动时刻取北京时间日期会跨过零点把标签推到次日。
          RELEASE_DATE="${RELEASE_DATE_INPUT}"
          if [ -z "${RELEASE_DATE}" ]; then
            SLOT_DAY=$(date -u +%F)
            if [ "$(date -u +%H)" -lt 15 ]; then
              SLOT_DAY=$(date -u -d "${SLOT_DAY} -1 day" +%F)
            fi
            RELEASE_DATE=${SLOT_DAY//-/.}
          fi
          if ! [[ "${RELEASE_DATE}" =~ ^20[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "非法发布日期：${RELEASE_DATE}（应为 YYYY.MM.DD）" >&2
            exit 1
          fi
          echo "RELEASE_DATE=${RELEASE_DATE}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_DATE}" >> "$GITHUB_ENV"

      - name: Check whether this snapshot is already published
        id: published
        env:
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          set -euo pipefail
          if [ "${FORCE_RELEASE}" != "true" ]; then
            PUBLISHED_TAGS=$(git tag --points-at "${GITHUB_SHA}" | grep -E '^20[0-9]{2}\.[0-9]{2}\.[0-9]{2}$' || true)
            if [ -n "${PUBLISHED_TAGS}" ]; then
              echo "当前提交已由 $(echo "${PUBLISHED_TAGS}" | tr '\n' ' ')发布，跳过本次重复发布。"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            echo "标签 ${RELEASE_TAG} 已存在（$(git rev-parse --short "refs/tags/${RELEASE_TAG}^{commit}")），按同日补充发布更新。"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.published.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate tools, titles and publication source
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/tests -p "test_*.py"
          python tools/check_project_docs.py
          python tools/publish_preflight.py --source EPUB

      - name: Create EPUB files
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          rm -rf output/
          python tools/package_cache_epubs.py --source EPUB --output output/epubs

      - name: Create merged ZIPs
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd output/epubs
          shopt -s nullglob

          Collections=(
            "All:【"
            "A_Certain_Magical_Index:【S1_"
            "A_Certain_Magical_Index_New_Testament:【S2_"
            "A_Certain_Magical_Index_Genesis_Testament:【S3_"
            "A_Certain_Dark_Side_Item:【S4_"
            "A_Certain_Magical_Index_SP:【S5_ 【S6_"
          )
          for entry in "${Collections[@]}"; do
            ARCHIVE_NAME="${entry%%:*}"
            PREFIXES="${entry#*:}"

            FILES=()
            for PREFIX in ${PREFIXES}; do
              for FILE in "${PREFIX}"*.epub; do
                FILES+=("${FILE}")
              done
            done

            if (( ${#FILES[@]} == 0 )); then
              echo "No EPUB files found for collection: ${ARCHIVE_NAME}" >&2
              exit 1
            fi

            zip -r "../${ARCHIVE_NAME}.${RELEASE_DATE}.zip" "${FILES[@]}"
          done

      - name: Generate Release Notes and Rename EPUB files
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/"
          shopt -s nullglob

          NOTE="## 合集\n\n"
          Collections=(
            "All:合集(${RELEASE_DATE})"
            "A_Certain_Magical_Index:某魔法的禁书目录 旧约(${RELEASE_DATE})"
            "A_Certain_Magical_Index_New_Testament:某魔法的禁书目录 新约(${RELEASE_DATE})"
            "A_Certain_Magical_Index_Genesis_Testament:某魔法的禁书目录 创约(${RELEASE_DATE})"
            "A_Certain_Dark_Side_Item:某暗部的少女共栖(${RELEASE_DATE})"
            "A_Certain_Magical_Index_SP:某魔法的禁书目录 番外(${RELEASE_DATE})"
          )
          for entry in "${Collections[@]}"; do
            ARCHIVE_NAME="${entry%%:*}"
            NAME="${entry#*:}"
            NOTE="${NOTE}- [${NAME}](${BASE_URL}${ARCHIVE_NAME}.${RELEASE_DATE}.zip)\n"
          done

          NOTE="${NOTE}\n## 单行本\n"
          SERIES_GROUPS=(
            "说明:【S0_"
            "某魔法的禁书目录 旧约:【S1_"
            "某魔法的禁书目录 新约:【S2_"
            "某魔法的禁书目录 创约:【S3_"
            "某暗部的少女共栖:【S4_"
            "某魔法的禁书目录 番外:【S5_ 【S6_"
          )
          for entry in "${SERIES_GROUPS[@]}"; do
            LABEL="${entry%%:*}"
            PREFIXES="${entry#*:}"
            NOTE="${NOTE}\n### ${LABEL}\n\n"
            for PREFIX in ${PREFIXES}; do
              for file in output/epubs/${PREFIX}*.epub; do
                filename=$(basename "$file")
                # 作品号定界符为全角 `【】`；它们不是 glob 元字符，后面的 * 才是通配符。
                if [[ "${filename}" != 【*】* ]]; then
                  echo "Unexpected EPUB directory name: ${filename}" >&2
                  exit 1
                fi
                short_name="${filename%%】*}"
                short_name="${short_name#【}.epub"
                mv "${file}" "output/epubs/${short_name}"
                name=$(basename "$filename" .epub)
                NOTE="${NOTE}- [${name}](${BASE_URL}${short_name})\n"
              done
            done
          done

          echo -e "${NOTE}" > output/release_notes.md

      - name: Upload to Release
        if: steps.published.outputs.skip != 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_DATE }}
          commit: ${{ github.sha }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          makeLatest: true
          bodyFile: output/release_notes.md
          artifacts: |
            output/All.*.zip
            output/A_Certain_Magical_Index.*.zip
            output/A_Certain_Magical_Index_New_Testament.*.zip
            output/A_Certain_Magical_Index_Genesis_Testament.*.zip
            output/A_Certain_Dark_Side_Item.*.zip
            output/A_Certain_Magical_Index_SP.*.zip
            output/epubs/*.epub

      - name: Update daily release tag
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # 资产上传成功后才移动标签；上传失败时标签保持原位，下一次运行会重试。
          git tag --force "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}" --force
