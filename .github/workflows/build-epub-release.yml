name: Build EPUB Release

on:
  push:
    branches:
      - master
    paths:
      - 'EPUB/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epub-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-epubs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare release metadata
        run: |
          set -euo pipefail
          RELEASE_DATE=$(TZ=Asia/Shanghai date +'%Y.%m.%d')
          echo "RELEASE_DATE=${RELEASE_DATE}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_DATE}" >> "$GITHUB_ENV"

      - name: Create EPUB files
        run: |
          set -euo pipefail
          rm -rf output/
          python tools/package_cache_epubs.py --source EPUB --output output/epubs

      - name: Create merged ZIPs
        run: |
          set -euo pipefail
          cd output/epubs
          shopt -s nullglob

          Collections=(
            "All:["
            "A_Certain_Magical_Index:[S1_"
            "A_Certain_Magical_Index_New_Testament:[S2_"
            "A_Certain_Magical_Index_Genesis_Testament:[S3_"
            "A_Certain_Dark_Side_Item:[S4_"
            "A_Certain_Magical_Index_SP:[S5_ [S6_"
          )
          for entry in "${Collections[@]}"; do
            ARCHIVE_NAME="${entry%%:*}"
            PREFIXES="${entry#*:}"

            FILES=()
            for PREFIX in ${PREFIXES}; do
              for FILE in "${PREFIX}"*.epub; do
                FILES+=("${FILE}")
              done
            done

            if (( ${#FILES[@]} == 0 )); then
              echo "No EPUB files found for collection: ${ARCHIVE_NAME}" >&2
              exit 1
            fi

            zip -r "../${ARCHIVE_NAME}.${RELEASE_DATE}.zip" "${FILES[@]}"
          done

      - name: Generate Release Notes and Rename EPUB files
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/"
          shopt -s nullglob

          NOTE="## 合集\n\n"
          Collections=(
            "All:合集(${RELEASE_DATE})"
            "A_Certain_Magical_Index:某魔法的禁书目录 旧约(${RELEASE_DATE})"
            "A_Certain_Magical_Index_New_Testament:某魔法的禁书目录 新约(${RELEASE_DATE})"
            "A_Certain_Magical_Index_Genesis_Testament:某魔法的禁书目录 创约(${RELEASE_DATE})"
            "A_Certain_Dark_Side_Item:某暗部的少女共栖(${RELEASE_DATE})"
            "A_Certain_Magical_Index_SP:某魔法的禁书目录 番外(${RELEASE_DATE})"
          )
          for entry in "${Collections[@]}"; do
            ARCHIVE_NAME="${entry%%:*}"
            NAME="${entry#*:}"
            NOTE="${NOTE}- [${NAME}](${BASE_URL}${ARCHIVE_NAME}.${RELEASE_DATE}.zip)\n"
          done

          NOTE="${NOTE}\n## 单行本\n"
          SERIES_GROUPS=(
            "说明:[S0_"
            "某魔法的禁书目录 旧约:[S1_"
            "某魔法的禁书目录 新约:[S2_"
            "某魔法的禁书目录 创约:[S3_"
            "某暗部的少女共栖:[S4_"
            "某魔法的禁书目录 番外:[S5_ [S6_"
          )
          for entry in "${SERIES_GROUPS[@]}"; do
            LABEL="${entry%%:*}"
            PREFIXES="${entry#*:}"
            NOTE="${NOTE}\n### ${LABEL}\n\n"
            for PREFIX in ${PREFIXES}; do
              for file in output/epubs/${PREFIX}*.epub; do
                filename=$(basename "$file")
                if [[ "${filename}" != \[*\]* ]]; then
                  echo "Unexpected EPUB directory name: ${filename}" >&2
                  exit 1
                fi
                short_name="${filename%%]*}"
                short_name="${short_name:1}.epub"
                mv "${file}" "output/epubs/${short_name}"
                name=$(basename "$filename" .epub)
                NOTE="${NOTE}- [${name}](${BASE_URL}${short_name})\n"
              done
            done
          done

          echo -e "${NOTE}" > output/release_notes.md

      - name: Update daily release tag
        run: |
          set -euo pipefail
          git tag --force "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}" --force

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_DATE }}
          allowUpdates: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          makeLatest: true
          bodyFile: output/release_notes.md
          artifacts: |
            output/All.*.zip
            output/A_Certain_Magical_Index.*.zip
            output/A_Certain_Magical_Index_New_Testament.*.zip
            output/A_Certain_Magical_Index_Genesis_Testament.*.zip
            output/A_Certain_Dark_Side_Item.*.zip
            output/A_Certain_Magical_Index_SP.*.zip
            output/epubs/*.epub
