name: Normalize EPUB Text

# 每日对 EPUB/ 做字符级规范化与机械结构自愈（docs/translation-spec.md 的可机械执行子集）。
#
# 设计口径（「宁愿不改，也不乱改」）：
#   - 字符替换：只做替换值唯一、1:1、全量核对无例外的字符替换；规则表见 tools/text_norm.py。
#   - 标签清理：安全移除空 <b> 标签，加粗内标点外移。
#   - 译注排序自愈：在定义与引用完全一致的前提下，按正文首次引用顺序重排 Note 条目，保留 ID 与正文引用（tools/reorder_notes.py）。
#   - 裸图包裹：单行独占裸 <img> 包裹 <p>，严格禁止删除任何结构行（tools/wrap_cn_image_lines.py --wrap-only）。
#   - 不改变物理行数、不改模板、不改文件名、不动未引用的结构，因此不影响中日行数对齐。
#   - 提交信息主语取实际 diff（改动文件数／行数），正文逐条列出三步各自的结论。三步都会
#     写盘，只取单个工具的摘要当主语会在其 0 命中时误报（曾出现「文本 0 处」而实际包
#     <p> 10 行的提交），因此任一步为 0 都不代表整体为 0。
#   - 无命中时完全不提交，不制造空 commit。
#   - 修复提交由 build-epub-release.yml 在每日北京时间 23:00 的定时发布中打包；
#     需要提前发版时可手动 workflow_dispatch 触发 Build EPUB Release。

on:
  schedule:
    - cron: "30 20 * * *" # UTC+8 04:30
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只报告，不写盘
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: normalize-epub-text-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 工具测试
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: 只读预检
        run: python tools/text_norm.py --report /tmp/text-norm-report.md

      - name: 应用文本规范化
        if: ${{ inputs.dry_run != true }}
        run: |
          python tools/text_norm.py --apply \
            --report /tmp/text-norm-report.md \
            --summary /tmp/text-norm-summary.txt

      - name: 译注排序自愈
        run: |
          set -o pipefail   # 默认 shell 无 pipefail，tee 会吞掉工具退出码
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python tools/reorder_notes.py --root EPUB --no-backup --dry-run 2>&1 | tee /tmp/step-reorder-notes.log
          else
            python tools/reorder_notes.py --root EPUB --no-backup --apply 2>&1 | tee /tmp/step-reorder-notes.log
          fi

      - name: 裸图行包裹自愈（纯包裹，不删行）
        run: |
          set -o pipefail   # 同上：换掉裸调用后仍要让「拒绝写入」非零退出中断流程
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python tools/wrap_cn_image_lines.py --root EPUB --wrap-only 2>&1 | tee /tmp/step-wrap-img.log
          else
            python tools/wrap_cn_image_lines.py --root EPUB --wrap-only --apply 2>&1 | tee /tmp/step-wrap-img.log
          fi

      # 标题合同只读阻断；不加入标题自动修复，异常留待本地确认。
      - name: 修改后发布预检（含只读标题门禁）
        run: python tools/publish_preflight.py --source EPUB

      - name: 写入 job summary
        if: always()
        run: |
          if [ -f /tmp/text-norm-report.md ]; then
            cat /tmp/text-norm-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 检查是否有实际修改
        id: diff
        if: ${{ inputs.dry_run != true }}
        run: |
          git add -N EPUB/
          if [ -n "$(git status --porcelain EPUB/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到修改："
            git diff --stat EPUB/
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无命中，未修改任何文件，不提交。"
          fi

      - name: 组装提交信息
        id: msg
        if: steps.diff.outputs.changed == 'true'
        run: |
          # 主语取实际 diff，不取单个工具的摘要：三步自愈都写盘，text_norm 0 命中不代表
          # 整体 0 命中（历史问题：报「文本 0 处」而 wrap 实包 5 个文件 10 行）。
          files=$(git diff --numstat EPUB/ | wc -l | tr -d ' ')
          added=$(git diff --numstat EPUB/ | awk '{a += $1} END {print a + 0}')
          deleted=$(git diff --numstat EPUB/ | awk '{d += $2} END {print d + 0}')
          subject="style(epub): 自动规范化 EPUB 文本与结构自愈"
          if [ "$files" -gt 0 ]; then
            subject="${subject}（${files} 个文件，+${added}/-${deleted} 行）"
          fi

          {
            echo "$subject"
            details=""
            norm=$(sed -n 's/^style(epub): //p' /tmp/text-norm-summary.txt 2>/dev/null | head -n 1 || true)
            if [ -n "$norm" ]; then
              details="${details}- 字符级规范化：${norm}"$'\n'
            fi
            reorder=$(grep -m1 -E '^(已写盘|预览)' /tmp/step-reorder-notes.log 2>/dev/null | sed 's/：$//' || true)
            if [ -n "$reorder" ]; then
              details="${details}- 译注排序自愈：${reorder}"$'\n'
            fi
            wrap=$(grep -m1 -E '^(已写盘|预览)' /tmp/step-wrap-img.log 2>/dev/null | sed 's/：$//' || true)
            if [ -n "$wrap" ]; then
              details="${details}- 裸图包裹：${wrap}"$'\n'
            fi
            if [ -n "$details" ]; then
              echo ""
              echo "各步结论："
              printf '%s' "$details"
            fi
            echo ""
            echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/text-norm-commit.txt

          echo "message<<__COMMIT_MSG_EOF__" >> "$GITHUB_OUTPUT"
          cat /tmp/text-norm-commit.txt >> "$GITHUB_OUTPUT"
          echo "__COMMIT_MSG_EOF__" >> "$GITHUB_OUTPUT"

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        uses: actions-js/push@master
        with:
          rebase: true
          branch: ${{ github.ref }}
          message: "${{ steps.msg.outputs.message }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}
