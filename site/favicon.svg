<svg xmlns="http://www.w3.org/2000/svg" viewBox="152 134 720 720" fill="none">
  <defs>
    <!-- Inner golden book flap gradients (left & right) -->
    <linearGradient id="flapL" x1="370" y1="296" x2="444" y2="458" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c66f10"/>
      <stop offset="48%" stop-color="#e59522"/>
      <stop offset="100%" stop-color="#f7be4b"/>
    </linearGradient>
    <linearGradient id="flapR" x1="654" y1="296" x2="580" y2="458" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c66f10"/>
      <stop offset="48%" stop-color="#e59522"/>
      <stop offset="100%" stop-color="#f7be4b"/>
    </linearGradient>

    <!-- Four curved golden book page gradients (amber tip -> warm gold -> creamy-white inner bend) -->
    <linearGradient id="pageTL" x1="270" y1="190" x2="446" y2="355" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e5921d"/>
      <stop offset="56%" stop-color="#f2b13b"/>
      <stop offset="84%" stop-color="#fbe49f"/>
      <stop offset="100%" stop-color="#fff8d6"/>
    </linearGradient>
    <linearGradient id="pageTR" x1="754" y1="190" x2="578" y2="355" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e5921d"/>
      <stop offset="56%" stop-color="#f2b13b"/>
      <stop offset="84%" stop-color="#fbe49f"/>
      <stop offset="100%" stop-color="#fff8d6"/>
    </linearGradient>
    <linearGradient id="pageBL" x1="270" y1="640" x2="446" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#df8b18"/>
      <stop offset="56%" stop-color="#f2b13b"/>
      <stop offset="84%" stop-color="#fbe49f"/>
      <stop offset="100%" stop-color="#fff8d6"/>
    </linearGradient>
    <linearGradient id="pageBR" x1="754" y1="640" x2="578" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#df8b18"/>
      <stop offset="56%" stop-color="#f2b13b"/>
      <stop offset="84%" stop-color="#fbe49f"/>
      <stop offset="100%" stop-color="#fff8d6"/>
    </linearGradient>

    <!-- Warm ambient light spill inside central dark trunk around archway -->
    <radialGradient id="trunkGlow" cx="512" cy="436" r="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a26d24"/>
      <stop offset="50%" stop-color="#4e3719"/>
      <stop offset="100%" stop-color="#222325"/>
    </radialGradient>

    <!-- Golden arch frame gradient -->
    <linearGradient id="archGrad" x1="512" y1="358" x2="512" y2="516" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e89420"/>
      <stop offset="50%" stop-color="#f2ad39"/>
      <stop offset="100%" stop-color="#fad57b"/>
    </linearGradient>

    <!-- Glowing doorway interior -->
    <linearGradient id="doorGlow" x1="512" y1="386" x2="512" y2="516" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdfef0"/>
      <stop offset="100%" stop-color="#fff8dc"/>
    </linearGradient>

    <!-- Perspective stairs gradients -->
    <linearGradient id="stair3Grad" x1="452" y1="544" x2="572" y2="544" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3c774"/>
      <stop offset="50%" stop-color="#fbe2a8"/>
      <stop offset="100%" stop-color="#f3c774"/>
    </linearGradient>
    <linearGradient id="stair4Grad" x1="512" y1="560" x2="512" y2="582" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f6cf86"/>
      <stop offset="100%" stop-color="#fcecc8" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Capital X gradient -->
    <linearGradient id="xTextGrad" x1="712" y1="696" x2="824" y2="812" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eeb85c"/>
      <stop offset="48%" stop-color="#d58014"/>
      <stop offset="100%" stop-color="#eca840"/>
    </linearGradient>
  </defs>

  <!-- Rounded warm off-white background card -->
  <rect x="152" y="134" width="720" height="720" rx="136" fill="#fcfbf7"/>

  <!-- 1. Bottom-Left & Bottom-Right Dark Wings -->
  <path d="M 236 527 L 390 420 L 444 464 C 446 467, 444 472, 439 476 L 236 618 Z" fill="#222325"/>
  <path d="M 788 527 L 634 420 L 580 464 C 578 467, 580 472, 585 476 L 788 618 Z" fill="#222325"/>

  <!-- 2. Top-Left & Top-Right Dark Wings -->
  <path d="M 236 209 L 372.5 296 L 372.5 406 L 236 311 Z" fill="#222325"/>
  <path d="M 788 209 L 651.5 296 L 651.5 406 L 788 311 Z" fill="#222325"/>

  <!-- 3. Inner Golden Book Flaps (Left & Right, collinear with top dark wings) -->
  <path d="M 372 296 C 409 320, 442 350, 445 394 L 445 464 L 372 405.5 Z" fill="url(#flapL)"/>
  <path d="M 652 296 C 615 320, 582 350, 579 394 L 579 464 L 652 405.5 Z" fill="url(#flapR)"/>

  <!-- 4. Four Curved Golden Book Pages (with clean curved white ribbon gap from flaps & wings) -->
  <!-- Top-Left Page -->
  <path d="M 266 179 L 360 240 C 414 275, 446 314, 446 375 C 442 344, 410 313.5, 347 270 L 266 214 Z" fill="url(#pageTL)"/>
  <!-- Top-Right Page -->
  <path d="M 758 179 L 664 240 C 610 275, 578 314, 578 375 C 582 344, 614 313.5, 677 270 L 758 214 Z" fill="url(#pageTR)"/>
  <!-- Bottom-Left Page -->
  <path d="M 266 653 L 363 594 C 414 556, 445 514, 446 466 C 443 492, 408 520, 350 558 L 266 615 Z" fill="url(#pageBL)"/>
  <!-- Bottom-Right Page -->
  <path d="M 758 653 L 661 594 C 610 556, 579 514, 578 466 C 581 492, 616 520, 674 558 L 758 615 Z" fill="url(#pageBR)"/>

  <!-- 5. Central Dark X Trunk -->
  <!-- Top-Right Upper Arm (strictly constant 10.50px parallel offset from main trunk right edge, curving smoothly into vertical needle tip) -->
  <path d="M 591.0 174.0 L 717.0 174.0 L 638.0 246.0 C 599.82 280.81, 575.83 313.73, 570.96 352.86 C 565.97 342.49, 559.48 333.14, 552.40 323.70 L 522.76 284.18 Q 515.56 274.58, 522.76 264.98 Z" fill="#222325"/>

  <!-- Main Continuous Trunk (Top-Left Arm -> Center Arch Pillars -> Bottom-Left & Bottom-Right Legs, outer-left curve is exact mirror of Top-Right arm) -->
  <path d="M 307.0 174.0 L 427.0 174.0 L 544.0 330.0 C 559.0 350.0, 570.0 368.0, 570.0 394.0 L 570.0 474.0 C 570.0 496.0, 581.0 518.0, 606.0 547.0 L 718.0 654.0 L 658.0 654.0 L 554.0 516.0 L 470.0 516.0 L 366.0 654.0 L 306.0 654.0 L 418.0 547.0 C 443.0 518.0, 454.0 496.0, 454.0 474.0 L 454.0 368.0 C 454.0 322.0, 429.0 285.2, 386.0 246.0 Z" fill="url(#trunkGlow)"/>

  <!-- 6. Golden Archway & Glowing Doorway -->
  <!-- Outer Golden Arch -->
  <path d="M 471 516 L 471 399 A 41 41 0 0 1 553 399 L 553 516 Z" fill="url(#archGrad)"/>
  <!-- Inner Glowing Doorway -->
  <path d="M 487 516 L 487 411 A 25 25 0 0 1 537 411 L 537 516 Z" fill="url(#doorGlow)"/>

  <!-- 7. Glowing Perspective Steps -->
  <polygon points="484,515 540,515 545,521 479,521" fill="#f7e1b0"/>
  <polygon points="475,525 549,525 556,532 468,532" fill="#f6d591"/>
  <polygon points="462,538 562,538 571,549 453,549" fill="url(#stair3Grad)"/>
  <polygon points="446,558 578,558 594,580 430,580" fill="url(#stair4Grad)"/>

  <!-- 8. Wordmark: index-X -->
  <!-- i -->
  <ellipse cx="208.5" cy="696.5" rx="16.0" ry="12.0" fill="#1f1f21"/>
  <rect x="193.5" y="719.0" width="30.0" height="90.0" fill="#1f1f21"/>

  <!-- n -->
  <path d="M 239.0 719.0 L 268.0 719.0 L 268.0 731.0 C 276.0 721.5, 287.5 717.0, 301.5 717.0 C 324.0 717.0, 338.5 730.0, 338.5 753.0 L 338.5 809.0 L 308.5 809.0 L 308.5 758.0 C 308.5 746.0, 301.5 739.5, 289.5 739.5 C 277.5 739.5, 268.5 746.5, 268.5 759.0 L 268.5 809.0 L 239.0 809.0 Z" fill="#1f1f21"/>

  <!-- d -->
  <path fill-rule="evenodd" clip-rule="evenodd" d="M 423.5 686.0 L 453.5 686.0 L 453.5 809.0 L 424.5 809.0 L 424.5 798.0 C 416.5 806.5, 405.0 811.0, 391.0 811.0 C 365.5 811.0, 348.0 792.5, 348.0 764.0 C 348.0 735.5, 365.5 717.0, 391.0 717.0 C 405.0 717.0, 416.0 721.5, 423.5 730.0 Z M 401.5 739.5 C 388.0 739.5, 378.5 749.0, 378.5 764.0 C 378.5 779.0, 388.0 788.5, 401.5 788.5 C 414.5 788.5, 424.0 779.0, 424.0 764.0 C 424.0 749.0, 414.5 739.5, 401.5 739.5 Z" fill="#1f1f21"/>

  <!-- e -->
  <path fill-rule="evenodd" clip-rule="evenodd" d="M 514.0 717.0 C 544.5 717.0, 563.5 735.5, 563.5 765.0 L 563.5 772.5 L 494.5 772.5 C 496.5 784.0, 506.0 790.5, 521.0 790.5 C 533.0 790.5, 544.0 787.5, 554.5 782.0 L 554.5 804.5 C 543.5 809.0, 530.5 811.0, 517.0 811.0 C 484.5 811.0, 463.5 792.5, 463.5 764.0 C 463.5 735.5, 484.5 717.0, 514.0 717.0 Z M 495.5 754.0 L 534.5 754.0 C 533.0 742.5, 525.5 736.5, 514.5 736.5 C 503.5 736.5, 496.8 742.5, 495.5 754.0 Z" fill="#1f1f21"/>

  <!-- x -->
  <path d="M 565.0 719.0 L 599.0 719.0 L 615.0 745.5 L 631.0 719.0 L 665.0 719.0 L 634.5 763.5 L 667.0 809.0 L 632.0 809.0 L 615.0 781.5 L 597.5 809.0 L 563.0 809.0 L 595.0 763.5 Z" fill="#1f1f21"/>

  <!-- hyphen - -->
  <rect x="666.5" y="754.5" width="44.5" height="21.5" fill="#232325"/>

  <!-- X -->
  <path d="M 706.0 696.0 L 748.5 696.0 L 769.5 732.0 L 790.5 696.0 L 832.0 696.0 L 791.0 755.0 L 834.0 814.0 L 790.5 814.0 L 768.5 776.0 L 746.5 814.0 L 704.0 814.0 L 746.5 755.0 Z" fill="url(#xTextGrad)"/>
</svg>
